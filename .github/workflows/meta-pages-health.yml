name: Bomuhamu policy pages health

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "privacy-policy/**"
      - "data-deletion/**"
      - "terms/**"
      - "review-guide/**"
      - ".github/workflows/meta-pages-health.yml"

permissions:
  contents: read

concurrency:
  group: bomuhamu-policy-health
  cancel-in-progress: true

jobs:
  check-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compare public HTML to current repository revision
        shell: bash
        env:
          SITE_BASE: https://bumssi12-ship-it.github.io/bomuhamu
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import hashlib
          import os
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.request

          root = pathlib.Path.cwd()
          base = os.environ["SITE_BASE"].rstrip("/")
          pages = (
              ("/", "index.html"),
              ("/privacy-policy/", "privacy-policy/index.html"),
              ("/data-deletion/", "data-deletion/index.html"),
              ("/terms/", "terms/index.html"),
              ("/review-guide/", "review-guide/index.html"),
          )

          def normalize(raw):
              return raw.decode("utf-8-sig").replace("\r\n", "\n").strip()

          def digest(body):
              return hashlib.sha256(body.encode("utf-8")).hexdigest()

          expected = {}
          for path, source in pages:
              local_path = root / source
              if not local_path.is_file():
                  print(f"[FAIL] Missing source: {source}", flush=True)
                  sys.exit(1)
              expected[path] = digest(normalize(local_path.read_bytes()))

          def check(entry):
              path, source = entry
              target_hash = expected[path]
              url = base + path + "?verify=" + target_hash[:12]
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Bomuhamu-Policy-Health/2.0",
                      "Accept": "text/html",
                      "Cache-Control": "no-cache",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=12) as response:
                      status = response.status
                      ctype = response.headers.get("Content-Type", "")
                      body = response.read(500001)
                  if status != 200:
                      return (path, "FAIL", f"HTTP {status}")
                  if "text/html" not in ctype.lower():
                      return (path, "FAIL", "Unexpected content type")
                  if len(body) > 500000:
                      return (path, "FAIL", "Response too large")
                  actual_hash = digest(normalize(body))
                  if actual_hash != target_hash:
                      return (path, "STALE", "Published HTML differs from checked-out source")
                  return (path, "PASS", "HTTP 200 and content SHA256 matches source")
              except (urllib.error.URLError, TimeoutError, OSError, UnicodeError, ValueError) as exc:
                  return (path, "FAIL", f"{type(exc).__name__}: {str(exc)[:130]}")

          push_event = os.environ.get("GITHUB_EVENT_NAME") == "push"
          attempts = 18 if push_event else 5
          interval = 10 if push_event else 15
          results = []

          for attempt in range(1, attempts + 1):
              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
                  results = list(pool.map(check, pages))
              successful = sum(1 for _, state, _ in results if state == "PASS")
              print(f"[INFO] Verification attempt {attempt}/{attempts}: {successful}/5 exact-content matches", flush=True)
              if successful == len(pages):
                  break
              if attempt < attempts:
                  time.sleep(interval)

          summary = "## Bomuhamu public policy health\n\n"
          summary += "| Public page | Result | Evidence |\n|---|---|---|\n"
          for path, state, detail in results:
              clean = detail.replace("|", "/").replace("\n", " ")
              print(f"[{state}] {base + path}: {clean}", flush=True)
              summary += f"| {path} | {state} | {clean} |\n"
          summary += "\nChecks exact checked-out source HTML against public GitHub Pages.\n"
          summary += "This does not verify Meta App Review permission approval or Windows runtime health.\n"

          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  fh.write(summary)

          if any(state != "PASS" for _, state, _ in results):
              sys.exit(1)
          PY
