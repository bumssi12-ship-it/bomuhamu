name: Bomuhamu policy pages health

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "privacy-policy/**"
      - "data-deletion/**"
      - "terms/**"
      - "review-guide/**"
      - ".github/workflows/meta-pages-health.yml"

permissions:
  contents: read

jobs:
  check-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public Meta policy URLs
        shell: bash
        env:
          SITE_BASE: https://bumssi12-ship-it.github.io/bomuhamu
        run: |
          python3 - <<'PY'
          import os
          import sys
          import time
          import urllib.request
          import urllib.error

          base = os.environ["SITE_BASE"].rstrip("/")
          checks = [
              ("/", "Bomuhamu"),
              ("/privacy-policy/", "Privacy Policy"),
              ("/data-deletion/", "User Data Deletion"),
              ("/terms/", "Terms of Service"),
              ("/review-guide/", "App Review Guide"),
          ]
          results = []
          for path, marker in checks:
              url = base + path
              status = "FAIL"
              details = ""
              for attempt in range(1, 5):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Bomuhamu-Policy-Health/1.0",
                                   "Accept": "text/html"},
                      )
                      with urllib.request.urlopen(req, timeout=20) as response:
                          body = response.read(250_000).decode("utf-8", "replace")
                          code = response.status
                      if code == 200 and marker.lower() in body.lower():
                          status = "PASS"
                          details = "HTTP 200, expected content found"
                          break
                      details = f"HTTP {code}, required page marker missing"
                  except (urllib.error.URLError, TimeoutError, OSError) as exc:
                      details = f"{type(exc).__name__}: {str(exc)[:160]}"
                  if attempt < 4:
                      time.sleep(15)
              print(f"[{status}] {url}: {details}", flush=True)
              results.append((path, status, details))

          summary = "## Bomuhamu public policy health\n\n"
          summary += "| Page | Result | Detail |\n|---|---|---|\n"
          for path, status, details in results:
              safe = details.replace("|", "/").replace("\n", " ")
              summary += f"| `{path}` | {status} | {safe} |\n"
          summary += "\nThis checks public page availability, not Meta App Review approval.\n"
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  fh.write(summary)
          if any(status != "PASS" for _, status, _ in results):
              sys.exit(1)
          PY
